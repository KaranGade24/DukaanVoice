openapi: 3.0.3
info:
  title: DukaanVoice Sales API
  version: 1.0.0
paths:
  /api/sales/frequently-sold:
    get:
      summary: Get recently frequently sold products
      description: Returns active products ranked by quantities sold during the requested number of days, scoped to the authenticated shop.
      security:
        - bearerAuth: []
      parameters:
        - {
            in: query,
            name: periodDays,
            schema: { type: integer, minimum: 1, maximum: 365, default: 30 },
          }
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 50, default: 8 },
          }
      responses:
        "200": { description: Ranked active products and period }
        "401": { description: Authentication required }
        "403": { description: No active shop for the authenticated user }
  /api/sales/summary:
    get:
      summary: Get shop sales and current inventory summary
      description: Returns completed sales and receipts for bills created in a UTC date-only range (defaults to the current UTC month through today), actual credit repayments received during that date range even when their bills are older, remaining unpaid Udhar balances on bills created in the range, payment totals, and current stock valuation. Profit and expense accounting are unavailable because sale cost snapshots and expense records are not stored.
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        "200":
          description: Sales summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      period:
                        {
                          type: object,
                          properties:
                            {
                              from: { type: string, format: date },
                              to: { type: string, format: date },
                            },
                        }
                      salesTotal: { type: number }
                      billCount: { type: integer }
                      averageBill: { type: number }
                      payments:
                        {
                          type: array,
                          items:
                            {
                              type: object,
                              properties:
                                {
                                  method: { type: string },
                                  amount: { type: number },
                                  billCount: { type: integer },
                                },
                            },
                        }
                      inventory:
                        {
                          type: object,
                          properties:
                            {
                              activeProductCount: { type: integer },
                              stockValue: { type: number },
                              productsMissingPurchasePrice: { type: integer },
                            },
                        }
                      accounting:
                        {
                          type: object,
                          properties:
                            {
                              profitAvailable: { type: boolean },
                              expensesAvailable: { type: boolean },
                            },
                        }
        "400": { description: Invalid date or date range }
        "401": { description: Authentication required }
        "403": { description: No active shop for the authenticated user }
  /api/sales:
    get:
      summary: List paginated shop bills
      description: Searches bill number and item name/SKU. Results are restricted to the authenticated user's shop and sorted newest first.
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: search, schema: { type: string, maxLength: 100 } }
        - {
            in: query,
            name: paymentMethod,
            schema: { type: string, enum: [CASH, UPI, CARD, UDHAR] },
          }
        - {
            in: query,
            name: page,
            schema: { type: integer, minimum: 1, default: 1 },
          }
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        "200": { description: Paginated bill history }
        "400": { description: Invalid filters }
        "401": { description: Authentication required }
        "403": { description: No active shop for the authenticated user }
    post:
      summary: Complete a point-of-sale transaction
      description: Prices are read from active products owned by the authenticated user's shop. Sale, stock decrements, and SALE stock movements are committed in one MongoDB transaction. Send an Idempotency-Key header to safely retry.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            minLength: 8
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items, amountReceived, paymentMethod]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [productId, quantity]
                    properties:
                      productId: { type: string, pattern: "^[a-fA-F0-9]{24}$" }
                      quantity: { type: number, exclusiveMinimum: 0 }
                discount:
                  {
                    type: number,
                    minimum: 0,
                    default: 0,
                    description: Fixed bill discount in major currency units; cannot exceed subtotal.,
                  }
                amountReceived: { type: number, minimum: 0 }
                paymentMethod: { type: string, enum: [CASH, UPI, CARD, UDHAR] }
                customerId:
                  {
                    type: string,
                    pattern: "^[a-fA-F0-9]{24}$",
                    description: Optional customer from the authenticated shop.,
                  }
      responses:
        "201":
          description: Sale created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      saleNumber: { type: string }
                      subtotal: { type: number }
                      discount: { type: number }
                      total: { type: number }
                      amountReceived: { type: number }
                      change: { type: number }
                      paymentMethod:
                        { type: string, enum: [CASH, UPI, CARD, UDHAR] }
        "400":
          { description: Invalid product, discount, amount, or request data }
        "401": { description: Authentication required }
        "403": { description: No active shop for the authenticated user }
        "409":
          {
            description: Insufficient stock,
            concurrent stock update,
            or duplicate request conflict,
          }
        "503": { description: Transaction-capable MongoDB deployment required }
  /api/sales/{saleId}:
    get:
      summary: Retrieve a sale receipt for the authenticated shop
      security:
        - bearerAuth: []
      parameters:
        - {
            in: path,
            name: saleId,
            required: true,
            schema: { type: string, pattern: "^[a-fA-F0-9]{24}$" },
          }
      responses:
        "200":
          {
            description: Sale items,
            totals,
            payment details and credit payment history,
          }
        "401": { description: Authentication required }
        "403": { description: No active shop for the authenticated user }
        "404": { description: Sale not found for the authenticated shop }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
